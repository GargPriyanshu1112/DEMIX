defaults:
  - dataset: mnist
  - model: base
  - _self_
init_from: scratch
device_type: cpu

batch_size: 256

torch_compile: true
dataloader:
  pin_memory: true
  workers: 4
  drop_last: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
  eps: 1e-8
  fused: true
logging:
  log_dir: ./logs
  wandb:
    enable: false
    project: ddpm
    log_imgs: true
vis_n_samples: 16
vis_every_epoch: 10
save_every_epoch: 50
model_name: ${model.name}-${dataset.name}



n_epochs: 500
autocast_dtype: bf16
enable_tf32: true

ddpm:
  timesteps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  schedule: cosine
  classifier_free_guidance:
    enable: true
    scale: 3.0
    p_drop: 0.2 # prob at which labels are dropped during training a CFG Diffusion Model
