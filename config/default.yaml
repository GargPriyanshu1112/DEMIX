# -----------------------
# Hydra / Config Defaults
# -----------------------
defaults:
  - dataset: mnist
  - model: base
  - _self_

model_name: ${model.name}-${dataset.name}
init_from: scratch

# -----------------------
# Runtime / System
# -----------------------
device_type: auto
torch_compile: true
autocast_dtype: bf16
enable_tf32: true

# -----------------------
# Training Loop
# -----------------------
n_epochs: 500
batch_size: 256

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
  eps: 1e-8
  fused: true

# -----------------------
# Data Loading
# -----------------------
dataloader:
  workers: 4
  pin_memory: true
  drop_last: true

# -----------------------
# Method Config
# -----------------------
ddpm:
  timesteps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  schedule: cosine
  classifier_free_guidance:
    enable: false
    scale: 3.0
    p_drop: 0.2  # label drop prob during CFG training

# -----------------------
# Logging / Monitoring
# -----------------------
logging:
  log_dir: ./logs
  wandb:
    enable: false
    project: ddpm
    log_imgs: true

vis_n_samples: 20
vis_every_epoch: 10
save_every_epoch: 50
